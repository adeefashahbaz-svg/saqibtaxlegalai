<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners for maskable -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Outer subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />

  <!-- Central Emblem: Scale of Justice + Modern AI Geometry -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Central Pillar -->
    <path d="M-6 -140 L6 -140 L8 140 L-8 140 Z" fill="url(#goldGrad)" />
    
    <!-- Top Finial -->
    <circle cx="0" cy="-148" r="16" fill="#34d399" />
    <circle cx="0" cy="-148" r="8" fill="#ffffff" />
    
    <!-- Balance Beam -->
    <path d="M-130 -90 Q 0 -115 130 -90" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
    <circle cx="0" cy="-102" r="14" fill="#10b981" />
    
    <!-- Left Scale strings & pan -->
    <line x1="-120" y1="-85" x2="-155" y2="-10" stroke="#a7f3d0" stroke-width="4" />
    <line x1="-120" y1="-85" x2="-85" y2="-10" stroke="#a7f3d0" stroke-width="4" />
    <path d="M-170 -10 Q -120 40 -70 -10 Z" fill="url(#goldGrad)" fill-opacity="0.85" stroke="#34d399" stroke-width="4" />

    <!-- Right Scale strings & pan -->
    <line x1="120" y1="-85" x2="85" y2="-10" stroke="#a7f3d0" stroke-width="4" />
    <line x1="120" y1="-85" x2="155" y2="-10" stroke="#a7f3d0" stroke-width="4" />
    <path d="M70 -10 Q 120 40 170 -10 Z" fill="url(#goldGrad)" fill-opacity="0.85" stroke="#34d399" stroke-width="4" />

    <!-- Base / Pedestal -->
    <path d="M-70 140 L70 140 L90 170 L-90 170 Z" fill="url(#goldGrad)" />
    
    <!-- AI Sparkle Badges -->
    <path d="M-35 -30 L-25 -55 L0 -65 L-25 -75 L-35 -100 L-45 -75 L-70 -65 L-45 -55 Z" fill="#ffffff" opacity="0.9" />
    <path d="M35 10 L42 -5 L57 -12 L42 -19 L35 -34 L28 -19 L13 -12 L28 -5 Z" fill="#6ee7b7" opacity="0.9" />
  </g>

  <!-- Typography Banner at bottom -->
  <text x="256" y="450" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="4">SAQIBTAX AI</text>
</svg>
